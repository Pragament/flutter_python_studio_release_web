    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-N4SPZTRL6H');

        window.trackAnalyticsEvent = function(eventName, eventParamsJson) {
          if (typeof gtag !== 'function') {
            return;
          }

          let parsedParams = {};
          if (eventParamsJson) {
            try {
              parsedParams = JSON.parse(eventParamsJson);
            } catch (error) {
              console.warn('Failed to parse analytics event params', error);
            }
          }

          gtag('event', eventName, parsedParams);
        };
    </script>
